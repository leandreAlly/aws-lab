AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Lab 04 - Auto Scaling web tier.
  Multi-AZ VPC with a regional NAT gateway, internet-facing ALB in public
  subnets, and an Auto Scaling group of Apache instances in private
  subnets scaling on CPU. No inbound SSH; access via SSM Session Manager.

Parameters:
  LabName:
    Type: String
    Default: 'Lab 04 - Auto Scaling'
  InstanceType:
    Type: String
    Default: t3.micro
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  MinCapacity:
    Type: Number
    Default: 1
  DesiredCapacity:
    Type: Number
    Default: 1
  MaxCapacity:
    Type: Number
    Default: 4
  CpuTargetPercent:
    Type: Number
    Default: 30
  VpcCidr:
    Type: String
    Default: 10.1.0.0/16
  PublicSubnetACidr:
    Type: String
    Default: 10.1.0.0/24
  PublicSubnetBCidr:
    Type: String
    Default: 10.1.1.0/24
  PrivateSubnetACidr:
    Type: String
    Default: 10.1.10.0/24
  PrivateSubnetBCidr:
    Type: String
    Default: 10.1.11.0/24

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: lab04-vpc

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: lab04-public-subnet-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: lab04-public-subnet-b

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: lab04-private-subnet-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: lab04-private-subnet-b

  InternetGateway:
    Type: AWS::EC2::InternetGateway ## move it after vpc
    Properties:
      Tags:
        - Key: Name
          Value: lab04-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  RegionalNatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: VpcGatewayAttachment
    Properties:
      AvailabilityMode: regional
      ConnectivityType: public
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: lab04-regional-nat

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: lab04-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: lab04-private-rt

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref RegionalNatGateway

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - HTTP from the internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from the internet
      Tags:
        - Key: Name
          Value: lab04-alb-sg

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web instances - HTTP from the ALB only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: HTTP from the ALB
      Tags:
        - Key: Name
          Value: lab04-instance-sg

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: lab04-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: lab04-alb

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: lab04-tg
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: load_balancing.algorithm.type
          Value: round_robin
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Name
          Value: lab04-tg

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  SsmInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lab04-ssm-instance-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: lab04-ssm-instance-role

  SsmInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: lab04-ssm-instance-profile
      Roles:
        - !Ref SsmInstanceRole

  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: lab04-web-launch-template
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name: !Ref SsmInstanceProfile
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        Monitoring:
          Enabled: true
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: lab04-web
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -x
            dnf install -y httpd
            dnf install -y stress-ng || echo "stress-ng unavailable, using cpu-burn fallback"

            TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)
            LIP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)
            COLOR=$(echo $IID | md5sum | cut -c1-6)

            cat > /var/www/html/index.html <<EOF
            <html>
              <head><title>${LabName}</title></head>
              <body style="font-family: sans-serif; text-align: center; background:#$COLOR; color:#fff; margin-top: 12%">
                <h2>${LabName}</h2>
                <h1>$IID</h1>
                <p>Availability zone: <strong>$AZ</strong></p>
                <p>Private IP: <strong>$LIP</strong></p>
              </body>
            </html>
            EOF

            cat > /usr/local/bin/cpu-burn <<'EOF'
            #!/bin/bash
            DURATION=$1
            if [ -z "$DURATION" ]; then DURATION=300; fi
            CORES=$(nproc)
            PIDFILE=/run/cpu-burn.pids
            : > $PIDFILE
            for i in $(seq 1 $CORES); do
              setsid timeout $DURATION bash -c 'while :; do :; done' </dev/null >/dev/null 2>&1 &
              echo $! >> $PIDFILE
            done
            echo "burning $CORES vCPU(s) for $DURATION seconds, detached"
            echo "stop early with: sudo cpu-burn-stop"
            EOF
            chmod +x /usr/local/bin/cpu-burn

            cat > /usr/local/bin/cpu-burn-stop <<'EOF'
            #!/bin/bash
            PIDFILE=/run/cpu-burn.pids
            if [ -f $PIDFILE ]; then
              while read p; do
                kill -TERM -$p 2>/dev/null || kill -TERM $p 2>/dev/null
              done < $PIDFILE
              rm -f $PIDFILE
            fi
            echo "cpu-burn stopped"
            EOF
            chmod +x /usr/local/bin/cpu-burn-stop

            systemctl enable --now httpd

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: lab04-asg
      MinSize: !Ref MinCapacity
      DesiredCapacity: !Ref DesiredCapacity
      MaxSize: !Ref MaxCapacity
      VPCZoneIdentifier:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref TargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 180
      DefaultInstanceWarmup: 120
      MetricsCollection:
        - Granularity: 1Minute
      Tags:
        - Key: Name
          Value: lab04-web
          PropagateAtLaunch: true

  CpuTargetTrackingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref CpuTargetPercent

Outputs:
  AlbUrl:
    Description: Public endpoint for the application
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}'
  AutoScalingGroupName:
    Description: Auto Scaling group to watch during the scale-out demo
    Value: !Ref AutoScalingGroup
  TargetGroupFullName:
    Description: Target group to watch instances register into
    Value: !GetAtt TargetGroup.TargetGroupFullName
  RoundRobinTestCommand:
    Description: Run locally to see requests spread across instances
    Value: !Sub 'for i in $(seq 1 10); do curl -s http://${ApplicationLoadBalancer.DNSName} | grep -o "i-[0-9a-f]*"; done'
  StressTestCommand:
    Description: Run inside a Session Manager session to trigger scale-out
    Value: 'sudo /usr/local/bin/cpu-burn 600'
