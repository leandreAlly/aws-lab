name: Build and push the todo image to ECR

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecr-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: lab-05/app
  IMAGE_TAG: leandre_tuyambaze_todoapp

jobs:
  publish:
    name: Test, build and push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Run the test suite
        working-directory: ${{ env.APP_DIR }}
        run: npm ci && npm test

      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          role-session-name: gha-ecr-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build the image
        id: image
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          VERSION_LABEL="v${{ github.run_number }}-${{ github.run_attempt }}-${GITHUB_SHA::7}"

          docker build \
            --build-arg "VERSION_LABEL=$VERSION_LABEL" \
            --build-arg "COMMIT=${GITHUB_SHA::7}" \
            --build-arg "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "$IMAGE:$IMAGE_TAG" \
            --tag "$IMAGE:$IMAGE_TAG-$VERSION_LABEL" \
            "$APP_DIR"

          {
            echo "image=$IMAGE"
            echo "version=$VERSION_LABEL"
          } >> "$GITHUB_OUTPUT"

      - name: Check the image starts, then push it
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION_LABEL: ${{ steps.image.outputs.version }}
        run: |
          docker run -d --name verify -p 8080:8080 "$IMAGE:$IMAGE_TAG"

          for attempt in $(seq 1 20); do
            SERVING=$(curl -fsS --max-time 5 http://127.0.0.1:8080/api/version | jq -r .versionLabel) && break
            sleep 2
          done

          docker logs verify
          docker rm -f verify

          [ "${SERVING:-}" = "$VERSION_LABEL" ]

          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:$IMAGE_TAG-$VERSION_LABEL"
